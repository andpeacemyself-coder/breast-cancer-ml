{% extends "base.html" %}
{% block content %}
<div class="row">
  <div class="col-md-8">
    <h2>Welcome, {{ user.username }}</h2>
    <p>Email: {{ user.email }}</p>
    <p>Member since: {{ user.created_at.strftime('%Y-%m-%d') }}</p>
    <a class="btn btn-outline-primary" href="/records">View Records</a>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Quick actions</h5>
        <a class="btn btn-primary w-100 mb-2" href="/records">Add Record</a>
        <a class="btn btn-secondary w-100" href="/logout">Logout</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
